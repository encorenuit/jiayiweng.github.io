  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="nav-shell">
        <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation"><span></span><span></span></button>

        </nav>

    <main class="page" id="main">
      <section class="shell page-intro">
        <div class="gallery-intro reveal">
          <h1 data-i18n="galleryTitle">Gallery</h1>
          <p class="intro-copy" data-i18n="galleryIntro">Photographs from places I have passed through and moments I wanted to keep.</p>
        </div>
      </section>

      <section class="shell" aria-label="Photography archive">
        <div class="photo-wall">
          <div class="photo-row">
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-06.jpg">
              <img src="assets/gallery/gallery-06.jpg" width="1707" height="1280" alt="Coastal town beneath a blue sky" loading="eager" decoding="async">
            </button>
            <button class="gallery-item vertical" type="button" data-gallery-src="assets/gallery/gallery-09.jpg">
              <img src="assets/gallery/gallery-09.jpg" width="1280" height="1707" alt="Gundam statue against the sky" loading="eager" decoding="async">
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-10.jpg">
              <img src="assets/gallery/gallery-10.jpg" width="1707" height="1280" alt="Cherry blossoms along a street" loading="eager" decoding="async">
            </button>
          </div>
          <div class="photo-row pair">
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-03.jpg">
              <img src="assets/gallery/gallery-03.jpg" width="1280" height="960" alt="A small plush toy overlooking the sea" loading="lazy" decoding="async">
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-07.jpg">

            </button>
            <button class="gallery-item vertical" type="button" data-gallery-src="assets/gallery/gallery-02.jpg">
              <img src="assets/gallery/gallery-02.jpg" width="1280" height="1707" alt="A table set with lunch and coffee" loading="lazy" decoding="async">
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-05.jpg">
              <img src="assets/gallery/gallery-05.jpg" width="1707" height="1280" alt="An omelette and a drink" loading="lazy" decoding="async">
            </button>
          </div>
          <div class="photo-row pair">
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-08.jpg">
              <img src="assets/gallery/gallery-08.jpg" width="1707" height="1280" alt="An IVE display at a shop" loading="lazy" decoding="async">
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-13.jpg">

            </button>

          <div class="photo-row">
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-01.jpg">
              <img src="assets/gallery/gallery-01.jpg" width="1707" height="1280" alt="A meal by the window" loading="lazy" decoding="async">
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-11.jpg">
              <img src="assets/gallery/gallery-11.jpg" width="1707" height="1280" alt="Vending machines beneath cherry blossoms" loading="lazy" decoding="async">
            </button>
            <button class="gallery-item" type="button" data-gallery-src="assets/gallery/gallery-12.jpg">

    <dialog class="lightbox" data-lightbox-dialog aria-label="Image viewer">
      <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close image viewer">×</button>
      <button class="lightbox-nav previous" type="button" data-lightbox-previous aria-label="Previous photograph">←</button>
      <img alt="Selected gallery photograph" data-lightbox-image>
      <button class="lightbox-nav next" type="button" data-lightbox-next aria-label="Next photograph">→</button>
    </dialog>

    <footer class="site-footer">
      <div class="shell footer-grid">
        <div><h2 data-i18n="footerTitle">Let’s compare notes.</h2><p><span data-i18n="footerBody">Academic conversations, research collaboration, and thoughtful ideas are welcome.</span><br>© <span data-year></span> Jiayi Weng</p></div>
