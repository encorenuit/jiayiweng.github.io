<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A personal photography archive by Jiayi Weng.">
    <meta name="theme-color" content="#161d29">
    <title data-i18n="galleryPageTitle">Gallery · Jiayi Weng</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script>
      const seasons = ["winter", "spring", "summer", "autumn"];
      const calendarSeason = () => seasons[Math.floor((new Date().getMonth() + 1) / 3) % 4];
      document.documentElement.dataset.season = calendarSeason();
      try {
        const theme = localStorage.getItem("jiayi-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        const season = localStorage.getItem("jiayi-season");
        if (seasons.includes(season)) document.documentElement.dataset.season = season;
      } catch {}
    </script>
    <link rel="stylesheet" href="assets/css/styles.css?v=6">
    <script src="assets/js/main.js?v=8" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="skipToContent">Skip to content</a>
    <header class="site-header">
      <div class="nav-shell">
        <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation"><span></span><span></span></button>
        <nav class="nav-links" id="site-navigation" data-navigation aria-label="Primary navigation">
          <a href="index.html" data-i18n="navHome">Home</a>
          <a href="research.html" data-i18n="navResearch">Research</a>
          <a href="experience.html" data-i18n="navExperience">Experience</a>
          <a href="gallery.html" aria-current="page" data-i18n="navGallery">Gallery</a>
          <div class="language-switcher" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中</button></div>
        </nav>
        <div class="site-controls">
          <details class="season-picker" data-season-picker>
            <summary class="site-control" data-season-trigger aria-label="Season" title="Season"><span class="season-symbol" aria-hidden="true"></span></summary>
            <div class="season-options">
              <button type="button" data-season-choice="auto" data-i18n="seasonAuto" aria-pressed="true">By month</button>
              <button type="button" data-season-choice="spring" data-i18n="seasonSpring" aria-pressed="false">Spring · Cherry blossom</button>
              <button type="button" data-season-choice="summer" data-i18n="seasonSummer" aria-pressed="false">Summer · Green leaves</button>
              <button type="button" data-season-choice="autumn" data-i18n="seasonAutumn" aria-pressed="false">Autumn · Maple</button>
              <button type="button" data-season-choice="winter" data-i18n="seasonWinter" aria-pressed="false">Winter · Snow</button>
              <button type="button" class="season-replay" data-season-replay data-i18n="seasonReplay">Replay animation</button>
            </div>
          </details>
          <button class="site-control" type="button" data-theme-toggle aria-label="Dark mode" aria-pressed="true" title="Dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13a9 9 0 0 1-10-10 9 9 0 1 0 10 10Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page" id="main">
      <section class="shell page-intro">
        <div class="gallery-intro reveal">
          <h1 data-i18n="galleryTitle">Gallery</h1>
          <p class="intro-copy" data-i18n="galleryInterests">K-pop · Travel · Formula 1 · Boxing · Photography</p>
          <figure class="gallery-quote">
            <blockquote cite="https://jti.lib.virginia.edu/japanese/texts/AnoHeik/vol1.html"><p data-i18n="galleryQuote">“The bells of the Gion monastery echo the impermanence of all things.”</p></blockquote>
            <figcaption>— <cite><a href="https://jti.lib.virginia.edu/japanese/texts/AnoHeik/vol1.html" target="_blank" rel="noreferrer" data-i18n="galleryQuoteSource">The Tale of the Heike, opening lines</a></cite></figcaption>
          </figure>
        </div>
      </section>

        </div>
